name: P3 Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-automation-hub-production
  cancel-in-progress: false

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Security check
        run: npm run security

      - name: Self test
        run: npm test

      - name: Preflight
        run: npm run preflight

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Deploy to Cloudflare
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          DEPLOY_URL="$(node scripts/parse-deploy-url.mjs deploy.log)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Actual URL E2E verification with propagation retry
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          E2E_ATTEMPTS: 12
          E2E_DELAY_MS: 5000
        run: node scripts/e2e.mjs
