name: P3 Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["P3 Place Rank Daily", "P3 Place Rank Grid Daily"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-automation-hub-production
  cancel-in-progress: false

jobs:
  validate-deploy-verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize Cloudflare credentials
        id: credentials
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          CLEAN_CF_TOKEN="$(printf '%s' "$RAW_CF_TOKEN" | tr -d '[:space:]')"
          if [ -z "$CLEAN_CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty" >&2
            exit 1
          fi

          CLEAN_CF_ACCOUNT="$(printf '%s' "$RAW_CF_ACCOUNT" | tr -d '[:space:]')"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT#https://dash.cloudflare.com/}"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT#http://dash.cloudflare.com/}"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT#dash.cloudflare.com/}"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT%%/*}"

          if [ -z "$CLEAN_CF_ACCOUNT" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is empty" >&2
            exit 1
          fi
          if ! [[ "$CLEAN_CF_ACCOUNT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID format is invalid" >&2
            exit 1
          fi

          echo "::add-mask::$CLEAN_CF_TOKEN"
          echo "::add-mask::$CLEAN_CF_ACCOUNT"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_CF_ACCOUNT" >> "$GITHUB_ENV"

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Syntax check
        id: syntax
        run: npm run check

      - name: Security check
        id: security
        run: npm run security

      - name: Safety gate
        id: safety
        run: npm run safety

      - name: Self test
        id: selftest
        run: npm test

      - name: Preflight
        id: preflight
        run: npm run preflight

      - name: Wrangler dry-run
        id: dryrun
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Deploy to Cloudflare
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          DEPLOY_URL="$(node scripts/parse-deploy-url.mjs deploy.log)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Actual URL E2E verification with propagation retry
        id: e2e
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          E2E_ATTEMPTS: 12
          E2E_DELAY_MS: 5000
        run: node scripts/e2e.mjs

      - name: Place rank live URL verification with propagation retry
        id: place_rank_e2e
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          E2E_ATTEMPTS: 12
          E2E_DELAY_MS: 5000
        run: node scripts/place-rank-e2e.mjs

      - name: Create last-known-good deployment receipt
        id: receipt
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/deployment-receipt.mjs deploy.log deployment-receipt.json

      - name: Create automatic operations report
        id: report
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/operations-report.mjs
          cat p3-operations-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive last-known-good deployment and operations report
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: p3-last-known-good-${{ github.run_number }}
          path: |
            deployment-receipt.json
            p3-operations-report.json
            p3-operations-report.md
          retention-days: 30
          if-no-files-found: error

      - name: Create validated repair packet on failure
        if: failure()
        env:
          STEP_CREDENTIALS: ${{ steps.credentials.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_SYNTAX: ${{ steps.syntax.outcome }}
          STEP_SECURITY: ${{ steps.security.outcome }}
          STEP_SAFETY: ${{ steps.safety.outcome }}
          STEP_SELFTEST: ${{ steps.selftest.outcome }}
          STEP_PREFLIGHT: ${{ steps.preflight.outcome }}
          STEP_DRYRUN: ${{ steps.dryrun.outcome }}
          STEP_DEPLOY: ${{ steps.deploy.outcome }}
          STEP_E2E: ${{ steps.e2e.outcome }}
          STEP_RECEIPT: ${{ steps.receipt.outcome }}
          STEP_REPORT: ${{ steps.report.outcome }}
          STEP_ARCHIVE: ${{ steps.archive.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          npm run triage
          cat p3-repair-packet.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive validated repair packet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p3-repair-packet-${{ github.run_number }}
          path: |
            p3-repair-packet.json
            p3-repair-packet.md
          retention-days: 14
          if-no-files-found: error
