name: TEMP K-YouTube V7 Branch Build

on:
  push:
    branches: [feature/k-youtube-v7-ultra-low-latency]
    paths:
      - 'android/k-youtube-app/**'
      - '.github/workflows/k-youtube-v7-branch-build.yml'

permissions:
  contents: read

jobs:
  build-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - name: Prepare pinned whisper.cpp Android library
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_SHA='1da4dc82fa7996d4edda05890dca65aeceaafd6d'
          WHISPER_DIR='android/k-youtube-app/vendor/whisper.cpp'
          rm -rf "$WHISPER_DIR"
          mkdir -p "$WHISPER_DIR"
          git -C "$WHISPER_DIR" init
          git -C "$WHISPER_DIR" remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C "$WHISPER_DIR" fetch --depth 1 origin "$WHISPER_SHA"
          git -C "$WHISPER_DIR" checkout --detach FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          p = Path('android/k-youtube-app/vendor/whisper.cpp/examples/whisper.android/lib/build.gradle')
          s = p.read_text()
          s = s.replace("abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'", "abiFilters 'arm64-v8a'")
          needle = "dependencies {\n"
          if "kotlinx-coroutines-core:1.8.1" not in s:
              s = s.replace(needle, needle + "    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'\n", 1)
          p.write_text(s)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V7 debug APK
        working-directory: android/k-youtube-app
        run: gradle --no-daemon clean assembleDebug
      - name: Verify V7 APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/k-youtube-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "versionName='0.7.0'"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libwhisper(_v8fp16_va)?\.so'
          grep -F 'FAST_MIN_SAMPLES = 24_000' android/k-youtube-app/app/src/main/java/com/kyoutube/free/ProjectionDubbingService.kt
          grep -F 'removeRepeatedOverlap' android/k-youtube-app/app/src/main/java/com/kyoutube/free/LocalDubbingEngine.kt
          grep -F '속도: 초고속' android/k-youtube-app/app/src/main/java/com/kyoutube/free/MainActivity.java
