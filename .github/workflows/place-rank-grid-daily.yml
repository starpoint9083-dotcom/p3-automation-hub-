name: P3 Place Rank Grid Daily

on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/place-rank.json'
      - 'scripts/place-rank-grid-scan.mjs'
      - 'scripts/place-rank-grid-merge.mjs'
      - 'src/place-rank-grid-data.js'
      - 'src/place-rank.js'
      - '.github/workflows/place-rank-grid-daily.yml'
  pull_request:
    branches: [main]
    paths:
      - 'config/place-rank.json'
      - 'data/place-rank-grid-history.json'
      - 'src/place-rank-grid-data.js'
      - 'src/place-rank.js'
      - 'scripts/place-rank-grid-scan.mjs'
      - 'scripts/place-rank-grid-merge.mjs'
      - '.github/workflows/place-rank-grid-daily.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: p3-place-rank-grid-daily
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: P3 syntax and safety checks
        run: |
          npm run check
          npm run security
          npm run safety
          npm test
          npm run preflight

  scan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: progressive
            keyword: 누진다초점안경
          - id: swimming-goggles
            keyword: 도수수경
          - id: polarized
            keyword: 편광선글라스
          - id: photochromic
            keyword: 변색렌즈
          - id: suyeong-optical
            keyword: 수영구안경점
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser controller
        run: npm install --no-audit --no-fund --no-save puppeteer-core@24.16.0

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium was not found on the runner." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Limit scan to one keyword
        env:
          GRID_KEYWORD: ${{ matrix.keyword }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p = 'config/place-rank.json';
          const doc = JSON.parse(fs.readFileSync(p, 'utf8'));
          doc.grid.keywords = [process.env.GRID_KEYWORD];
          doc.grid.concurrency = 1;
          fs.writeFileSync(p, `${JSON.stringify(doc, null, 2)}\n`);
          NODE

      - name: Scan 25 points for ${{ matrix.keyword }}
        run: node scripts/place-rank-grid-scan.mjs

      - name: Upload keyword snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: place-rank-grid-part-${{ matrix.id }}
          path: data/place-rank-grid-history.json
          retention-days: 2
          if-no-files-found: error

      - name: Upload keyword diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-rank-grid-diagnostics-${{ matrix.id }}-${{ github.run_number }}
          path: artifacts/place-rank-grid/
          if-no-files-found: ignore
          retention-days: 14

  merge:
    if: github.event_name != 'pull_request' && needs.scan.result == 'success'
    needs: [validate, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download keyword snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: place-rank-grid-part-*
          path: artifacts/place-rank-grid-parts

      - name: Merge verified 5x5 keyword snapshots
        run: node scripts/place-rank-grid-merge.mjs

      - name: Add geogrid run summary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('data/place-rank-grid-history.json', 'utf8'));
          const latest = doc.latest;
          console.log('## 스타포인트안경원 25지점 객관순위');
          console.log('');
          console.log(`검사시각: ${latest?.checkedAt || 'unknown'}`);
          console.log(`격자: ${latest?.grid?.size || '-'}x${latest?.grid?.size || '-'} · 간격 ${latest?.grid?.spacingMeters || '-'}m`);
          console.log('');
          console.log('| 키워드 | 중앙순위 | TOP3 | TOP10 | TOP20 | 노출력 | 매장앞 |');
          console.log('|---|---:|---:|---:|---:|---:|---:|');
          for (const item of latest?.summaries || []) {
            const median = Number.isFinite(item.medianRankCapped) ? item.medianRankCapped : '-';
            console.log(`| ${item.keyword} | ${median} | ${item.top3Pct ?? '-'}% | ${item.top10Pct ?? '-'}% | ${item.top20Pct ?? '-'}% | ${item.visibilityScore ?? '-'} | ${item.storePointRank ?? '-'} |`);
          }
          NODE

      - name: Commit verified geogrid snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "p3-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/place-rank-grid-history.json src/place-rank-grid-data.js
          if git diff --cached --quiet; then
            echo "No geogrid data changes to commit."
            exit 0
          fi
          DATE_KST="$(TZ=Asia/Seoul date +%F)"
          git commit -m "data(place-rank-grid): daily parallel 25-point snapshot ${DATE_KST}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Geogrid snapshot pushed to main."
              exit 0
            fi
            echo "Push attempt ${attempt} collided with a newer main; rebasing and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Automatic rebase failed; refusing to overwrite main." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

          echo "Unable to push geogrid snapshot after 5 retries." >&2
          exit 1
