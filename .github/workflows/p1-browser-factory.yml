name: P1 Browser Factory

on:
  workflow_dispatch:
    inputs:
      target_duration:
        description: 'Target duration per short in seconds (50-70)'
        required: false
        default: '60'
      run_mode:
        description: 'factory or inspect-assets'
        required: false
        default: 'factory'
  push:
    branches: [main]
    paths:
      - 'ops/p1-factory-live-test.trigger'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/preflight.mjs'
      - 'scripts/p1-browser-factory.mjs'
      - 'scripts/p1-live-queue-inspector.mjs'
      - 'scripts/p1-reference-asset-inspector.mjs'
      - 'scripts/p1-process-waiting-queues.mjs'
      - 'scripts/p1-pre-render-media-audit.mjs'
      - 'scripts/p1-quality-gate.mjs'
      - 'scripts/p1-use-suno-preview.mjs'
      - 'scripts/p1-download-preview.mjs'
      - 'ops/suno-preview/**'
      - '.github/workflows/p1-browser-factory.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run check
      - name: Repository security check
        run: npm run security
      - name: P3 preflight
        run: npm run preflight
      - name: Validate Suno preview transport
        shell: bash
        run: |
          set -euo pipefail
          cat ops/suno-preview/part_*.b64 | tr -d '\n\r ' | base64 -d > /tmp/p1-suno-preview.ogg
          test "$(sha256sum /tmp/p1-suno-preview.ogg | awk '{print $1}')" = "b42916af36c76599c91cfae8d8b569e5e25f398d0fe8f94ca70403227df31be3"
          test "$(head -c4 /tmp/p1-suno-preview.ogg)" = "OggS"
          echo "Existing Suno preview transport PASS"

  factory:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: p1-browser-factory-production
      cancel-in-progress: true
    env:
      P1_BASE_URL: https://k-stella-shorts-factory.k-stella-p1.workers.dev
      P1_TARGET_DURATION: ${{ inputs.target_duration || '60' }}
      P1_FACTORY_SUMMARY: p1_factory_summary.json
      P1_QUALITY_GATE_REPORT: p1_quality_gate.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve run mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.run_mode || 'factory' }}"
          else
            mode="$(sed -n 's/^mode=//p' ops/p1-factory-live-test.trigger | tail -1)"
            [ -n "$mode" ] || mode="factory"
          fi
          case "$mode" in factory|inspect-assets) ;; *) echo "Unsupported run mode: $mode" >&2; exit 1;; esac
          echo "P1_RUN_MODE=$mode" >> "$GITHUB_ENV"
          echo "P1 run mode: $mode"

      - name: Verify GitHub OIDC environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC environment is unavailable. Check id-token: write permission." >&2
            exit 1
          fi
          echo "GitHub OIDC identity is available for P1 session exchange."

      - name: Inspect P1 Stella/reference assets
        if: env.P1_RUN_MODE == 'inspect-assets'
        run: node scripts/p1-reference-asset-inspector.mjs

      - name: Install browser controller
        if: env.P1_RUN_MODE == 'factory'
        run: npm install --no-audit --no-fund --no-save puppeteer-core@24.16.0

      - name: Locate Chrome
        if: env.P1_RUN_MODE == 'factory'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium was not found on the runner." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Use existing Suno music asset in P1
        if: env.P1_RUN_MODE == 'factory'
        run: node scripts/p1-use-suno-preview.mjs

      - name: Inspect P1 live queue state
        if: env.P1_RUN_MODE == 'factory'
        run: node scripts/p1-live-queue-inspector.mjs

      - name: Rebuild and process P1 waiting queues
        if: env.P1_RUN_MODE == 'factory'
        run: node scripts/p1-process-waiting-queues.mjs

      - name: Audit selected P1 media before rendering
        if: env.P1_RUN_MODE == 'factory'
        run: node scripts/p1-pre-render-media-audit.mjs

      - name: Run P1 end-to-end factory
        if: env.P1_RUN_MODE == 'factory'
        run: node scripts/p1-browser-factory.mjs

      - name: Download rendered P1 preview
        if: always() && env.P1_RUN_MODE == 'factory'
        run: node scripts/p1-download-preview.mjs

      - name: P1 zero-cost quality gate
        if: always() && env.P1_RUN_MODE == 'factory'
        run: npm run p1:quality

      - name: Upload factory summary, preview, and quality gate
        if: always() && env.P1_RUN_MODE == 'factory'
        uses: actions/upload-artifact@v4
        with:
          name: p1-factory-summary-${{ github.run_number }}
          path: |
            p1_factory_summary.json
            p1_quality_gate.json
            p1_preview.webm
            p1_preview.json
          if-no-files-found: ignore
          retention-days: 14
