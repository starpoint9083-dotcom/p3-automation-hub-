name: P1 Browser Factory

on:
  workflow_dispatch:
    inputs:
      target_duration:
        description: 'Target duration per short in seconds (50-70)'
        required: false
        default: '60'
  push:
    branches: [main]
    paths:
      - 'ops/p1-factory-live-test.trigger'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/preflight.mjs'
      - 'scripts/p1-browser-factory.mjs'
      - '.github/workflows/p1-browser-factory.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: p1-browser-factory-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run check
      - name: Repository security check
        run: npm run security
      - name: P3 preflight
        run: npm run preflight

  factory:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P1_BASE_URL: https://k-stella-shorts-factory.k-stella-p1.workers.dev
      P1_TARGET_DURATION: ${{ inputs.target_duration || '60' }}
      P1_FACTORY_SUMMARY: p1_factory_summary.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify GitHub OIDC environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC environment is unavailable. Check id-token: write permission." >&2
            exit 1
          fi
          echo "GitHub OIDC identity is available for P1 session exchange."

      - name: Install browser controller
        run: npm install --no-audit --no-fund --no-save puppeteer-core@24.16.0

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium was not found on the runner." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Run P1 end-to-end factory
        run: node scripts/p1-browser-factory.mjs

      - name: Upload factory summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-factory-summary-${{ github.run_number }}
          path: p1_factory_summary.json
          if-no-files-found: ignore
          retention-days: 14
