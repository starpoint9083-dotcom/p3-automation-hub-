name: P3 K-YouTube Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/k-youtube-app/**'
      - 'config/k-youtube-free.json'
      - 'ops/K_YOUTUBE_ANDROID.md'
      - '.github/workflows/k-youtube-android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/k-youtube-app/**'
      - 'config/k-youtube-free.json'
      - 'ops/K_YOUTUBE_ANDROID.md'
      - '.github/workflows/k-youtube-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: p3-k-youtube-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'

      - name: Prepare pinned whisper.cpp Android library
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_SHA='1da4dc82fa7996d4edda05890dca65aeceaafd6d'
          WHISPER_DIR='android/k-youtube-app/vendor/whisper.cpp'
          rm -rf "$WHISPER_DIR"
          mkdir -p "$WHISPER_DIR"
          git -C "$WHISPER_DIR" init
          git -C "$WHISPER_DIR" remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C "$WHISPER_DIR" fetch --depth 1 origin "$WHISPER_SHA"
          git -C "$WHISPER_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$WHISPER_DIR" rev-parse HEAD)" = "$WHISPER_SHA"
          python - <<'PY'
          from pathlib import Path
          p = Path('android/k-youtube-app/vendor/whisper.cpp/examples/whisper.android/lib/build.gradle')
          s = p.read_text()
          s = s.replace("abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'", "abiFilters 'arm64-v8a'")
          needle = "dependencies {\n"
          if "kotlinx-coroutines-core:1.8.1" not in s:
              s = s.replace(needle, needle + "    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'\n", 1)
          p.write_text(s)
          PY
          grep -F "abiFilters 'arm64-v8a'" "$WHISPER_DIR/examples/whisper.android/lib/build.gradle"
          grep -F 'kotlinx-coroutines-core:1.8.1' "$WHISPER_DIR/examples/whisper.android/lib/build.gradle"

      - name: Restore stable debug signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: k-youtube-debug-keystore-v1

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA256:'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android/k-youtube-app
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK='android/k-youtube-app/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Verify V6 low-latency local dubbing
        shell: bash
        run: |
          set -euo pipefail
          APK='android/k-youtube-app/app/build/outputs/apk/debug/app-debug.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > /tmp/k-youtube-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/k-youtube-manifest.txt
          grep -F "package: name='com.kyoutube.free'" /tmp/k-youtube-badging.txt
          grep -F "versionName='0.6.0'" /tmp/k-youtube-badging.txt
          grep -F 'android.intent.category.APP_BROWSER' /tmp/k-youtube-manifest.txt
          grep -F 'android.intent.category.BROWSABLE' /tmp/k-youtube-manifest.txt
          grep -F 'android.permission.RECORD_AUDIO' /tmp/k-youtube-manifest.txt
          grep -F 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' /tmp/k-youtube-manifest.txt
          grep -F 'com.kyoutube.free.ProjectionDubbingService' /tmp/k-youtube-manifest.txt
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libwhisper(_v8fp16_va)?\.so'
          grep -F 'AudioPlaybackCaptureConfiguration' android/k-youtube-app/app/src/main/java/com/kyoutube/free/ProjectionDubbingService.kt
          grep -F 'CHUNK_SAMPLES = 48_000' android/k-youtube-app/app/src/main/java/com/kyoutube/free/ProjectionDubbingService.kt
          grep -F 'BufferOverflow.DROP_OLDEST' android/k-youtube-app/app/src/main/java/com/kyoutube/free/ProjectionDubbingService.kt
          grep -F 'TextToSpeech.QUEUE_ADD' android/k-youtube-app/app/src/main/java/com/kyoutube/free/ProjectionDubbingService.kt
          grep -F 'WARMUP_SAMPLE_COUNT = 16_000' android/k-youtube-app/app/src/main/java/com/kyoutube/free/LocalDubbingEngine.kt
          grep -F 'TranslateLanguage.KOREAN' android/k-youtube-app/app/src/main/java/com/kyoutube/free/LocalDubbingEngine.kt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: k-youtube-free-v6-low-latency-apk
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Report
        if: always()
        run: |
          {
            echo '### K-YouTube Android V6 ↔ P3'
            echo '- Existing share → K-YouTube handoff: preserved'
            echo '- Local playback capture: Android AudioPlaybackCapture + MediaProjection'
            echo '- Local ASR: pinned whisper.cpp tiny.en q5_1'
            echo '- Low-latency segmentation: 3.0-second chunks with latest-chunk backlog control'
            echo '- First-phrase optimization: Whisper + ML Kit warm-up before capture starts'
            echo '- Translation: ML Kit English → Korean on-device model'
            echo '- Voice: Android Korean TextToSpeech at 1.18x, queued phrases'
            echo '- Paid translation/dubbing/TTS API calls: none'
            echo '- Stable debug signing key: k-youtube-debug-keystore-v1'
            echo '- Existing K-YouTube AppDeploy web app: preserved'
            echo '- Build output: k-youtube-free-v6-low-latency-apk'
          } >> "$GITHUB_STEP_SUMMARY"
