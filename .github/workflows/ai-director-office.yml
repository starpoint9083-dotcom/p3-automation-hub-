name: AI Director Office Build Deploy Verify

on:
  push:
    branches: [ai-director-office-v1]
    paths:
      - "projects/ai-director-office/**"
      - ".github/workflows/ai-director-office.yml"
  workflow_dispatch:
    inputs:
      full_ai:
        description: "Run expensive 4-channel + image Full AI release verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ai-director-office-v1
  cancel-in-progress: true

jobs:
  build-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/ai-director-office
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize Cloudflare credentials
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLEAN_CF_TOKEN="$(printf '%s' "$RAW_CF_TOKEN" | tr -d '[:space:]')"
          CLEAN_CF_ACCOUNT="$(printf '%s' "$RAW_CF_ACCOUNT" | tr -d '[:space:]')"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT#https://dash.cloudflare.com/}"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT#http://dash.cloudflare.com/}"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT#dash.cloudflare.com/}"
          CLEAN_CF_ACCOUNT="${CLEAN_CF_ACCOUNT%%/*}"
          test -n "$CLEAN_CF_TOKEN"
          test -n "$CLEAN_CF_ACCOUNT"
          echo "::add-mask::$CLEAN_CF_TOKEN"
          echo "::add-mask::$CLEAN_CF_ACCOUNT"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_CF_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_CF_ACCOUNT" >> "$GITHUB_ENV"

      - name: Require AI Office admin secret
        shell: bash
        env:
          ADMIN_PASSWORD: ${{ secrets.AI_OFFICE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          test "${#ADMIN_PASSWORD}" -ge 12
          echo "::add-mask::$ADMIN_PASSWORD"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Self test
        run: npm test

      - name: Preflight
        run: npm run preflight

      - name: Ensure D1 and generate Wrangler config
        run: npm run prepare:wrangler

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ai-director-office-db --remote --config wrangler.generated.jsonc

      - name: Wrangler dry-run
        run: npm run dry-run

      - name: Deploy new Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy 2>&1 | tee deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -n 1)"
          test -n "$DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Quota-safe API and security E2E
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ADMIN_PASSWORD: ${{ secrets.AI_OFFICE_ADMIN_PASSWORD }}
        run: npm run verify

      - name: Install Chromium for quota-free mobile UI verification
        run: npx playwright install --with-deps chromium

      - name: Quota-free real mobile browser E2E
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ADMIN_PASSWORD: ${{ secrets.AI_OFFICE_ADMIN_PASSWORD }}
        run: npm run verify:browser

      - name: Student edit mobile E2E
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ADMIN_PASSWORD: ${{ secrets.AI_OFFICE_ADMIN_PASSWORD }}
        run: npm run verify:student-edit

      - name: Consultation stage mobile E2E
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ADMIN_PASSWORD: ${{ secrets.AI_OFFICE_ADMIN_PASSWORD }}
        run: npm run verify:lead-stage

      - name: Full AI release E2E
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_ai }}
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ADMIN_PASSWORD: ${{ secrets.AI_OFFICE_ADMIN_PASSWORD }}
        run: npm run verify:full-ai
