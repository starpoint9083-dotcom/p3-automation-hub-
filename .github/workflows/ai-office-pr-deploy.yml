name: AI Office PR Deploy Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/ai-director-office/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-office-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/ai-director-office
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Self test
        run: npm test

      - name: Product preflight
        run: npm run preflight

      - name: Confirm quota-safe PR gate
        run: |
          echo "PR gate intentionally performs no Cloudflare mutation, deployment, or live Workers AI calls."
          echo "Live deploy + API/browser E2E is owned by ai-director-office.yml on branch push."
