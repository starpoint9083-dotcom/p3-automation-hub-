name: P3 Blog Engine Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/blog-engine.js'
      - 'src/blog-engine-config.js'
      - 'scripts/blog-engine-preflight.mjs'
      - 'scripts/blog-engine-e2e.mjs'
      - 'wrangler.blog-engine.jsonc'
      - '.github/workflows/blog-engine-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-blog-engine-production
  cancel-in-progress: false

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check src/blog-engine.js
          node --check src/blog-engine-config.js
          node --check scripts/blog-engine-preflight.mjs
          node --check scripts/blog-engine-e2e.mjs

      - name: Security check
        run: npm run security

      - name: Blog engine preflight
        run: node scripts/blog-engine-preflight.mjs

      - name: Wrangler dry-run
        run: npx wrangler deploy --config wrangler.blog-engine.jsonc --dry-run --outdir dist-blog-engine

      - name: Deploy new blog Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.blog-engine.jsonc 2>&1 | tee blog-engine-deploy.log
          python - <<'PY'
          import re
          text=open('blog-engine-deploy.log',encoding='utf-8',errors='ignore').read()
          urls=re.findall(r'https://[^\s]+\.workers\.dev', text)
          if not urls:
              raise SystemExit('workers.dev URL not found in deploy output')
          url=urls[-1].rstrip('.,)')
          print('BLOG_ENGINE_URL='+url)
          with open(__import__('os').environ['GITHUB_ENV'],'a') as f:
              f.write('BLOG_ENGINE_URL='+url+'\n')
          PY

      - name: Live URL E2E with propagation retry
        run: node scripts/blog-engine-e2e.mjs

      - name: Deployment receipt
        if: always()
        run: |
          echo '## P3 Blog Engine' >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: p3-blog-engine" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${BLOG_ENGINE_URL:-not-resolved}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
