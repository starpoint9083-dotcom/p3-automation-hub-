name: P2 Safe Supervisor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'config/p2-my-life-room.json'
      - 'ops/P2_P3_SUPERVISOR_CONTRACT.md'
      - 'scripts/e2e.mjs'
      - 'scripts/preflight.mjs'
      - '.github/workflows/p2-supervisor.yml'
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: p3-p2-safe-supervisor
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      P2_REPO: starpoint9083-dotcom/my-life-room-v13-app
      P2_URL: https://my-life-room-v13-live-0910.starpoint9083.workers.dev
    steps:
      - name: Checkout P3 policy
        uses: actions/checkout@v4

      - name: Confirm supervisor safety contract
        shell: bash
        run: |
          set -euo pipefail
          test -f config/p2-my-life-room.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('config/p2-my-life-room.json','utf8'));
          if (c.automationPolicy?.mode !== 'external-supervisor') throw new Error('P2 supervisor mode missing');
          if (c.automationPolicy?.p2OwnsDeployment !== true) throw new Error('P2 must own deployment');
          if (c.automationPolicy?.paidGenerationInCI !== false) throw new Error('Paid generation must stay disabled in CI');
          if (c.automationPolicy?.paidVisualAIInCI !== false) throw new Error('Paid visual AI must stay disabled in P3 CI');
          if (c.automationPolicy?.paidMotionAIInCI !== false) throw new Error('Paid motion AI must stay disabled in P3 CI');
          if (c.automationPolicy?.p3MayDeleteOrRecreateCloudflareResources !== false) throw new Error('Cloudflare destructive mutation must stay disabled');
          if (c.qualityPolicy?.paidVisualAIInCI !== false) throw new Error('Paid visual AI must stay disabled in CI');
          if (c.qualityPolicy?.paidMotionAIInCI !== false) throw new Error('Paid motion AI must stay disabled in CI');
          if (c.qualityPolicy?.autoRegeneration !== false) throw new Error('Automatic regeneration must stay disabled');
          const deny = c.automationPolicy?.paidEndpointsNeverAutoCall || [];
          if (!deny.includes('/api/cinema/batch/visual-qc/start')) throw new Error('Visual QC paid start endpoint must be denylisted');
          if (!deny.includes('/api/cinema/batch/motion-qc/start')) throw new Error('Motion QC paid start endpoint must be denylisted');
          console.log('P2 supervisor safety contract: PASS');
          NODE

      - name: Detect current P2 main commit
        id: head
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote "https://github.com/${P2_REPO}.git" refs/heads/main | awk '{print $1}')"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "P2 main: $SHA"

      - name: Use direct production runtime supervision
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "state=success" >> "$GITHUB_OUTPUT"
          echo "run_url=runtime-direct-probe" >> "$GITHUB_OUTPUT"
          echo "P3 intentionally avoids cross-repository Actions API polling. P2 owns deployment; P3 verifies the actual production runtime directly."

      - name: Verify real P2 health URL
        if: steps.deploy.outputs.state == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 15 -H 'cache-control: no-cache' "$P2_URL/api/health" > health.json; then
              if node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync("health.json","utf8"));const ok=b.ok===true&&b.d1===true&&b.r2===true&&b.ai===true&&b.cinemaBackground===true;if(!ok){console.error(b);process.exit(1)}console.log(`P2 HEALTH PASS cinema=${b.cinemaEngine} model=${b.model}`);'; then
                break
              fi
            fi
            if [ "$i" = 5 ]; then echo "P2 real URL health verification failed" >&2; exit 10; fi
            sleep 5
          done

      - name: Verify read-only Cinema status
        if: steps.deploy.outputs.state == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -H 'cache-control: no-cache' "$P2_URL/api/cinema/batch/latest-public" > cinema.json
          node - <<'NODE'
          const fs=require('fs'); const b=JSON.parse(fs.readFileSync('cinema.json','utf8'));
          if(b.ok!==true || Number(b.total)!==9) { console.error(b); process.exit(11); }
          console.log(`P2 CINEMA READ-ONLY PASS status=${b.status} ready=${b.ready}/${b.total}`);
          NODE

      - name: Verify zero-cost Cinema technical quality manifest
        id: quality
        if: steps.deploy.outputs.state == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -H 'cache-control: no-cache' "$P2_URL/api/cinema/batch/quality-public" > quality.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('quality.json','utf8'));
          if(b.ok!==true || Number(b.total)!==9 || !Array.isArray(b.clips) || b.paidAiTriggered!==false) { console.error(b); process.exit(12); }
          const ready=Number(b.ready||0), score=Number(b.technicalScore||0), pass=b.technicalPass===true;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\nscore=${score}\npass=${pass}\nvisual=${String(b.visualReview||'pending')}\n`);
          if(ready===9 && (!pass || score!==100 || b.clips.length!==9 || b.clips.some(c=>c.technicalOk!==true))) {
            console.error('P2 Cinema technical QC failed for one or more completed clips', b);
            process.exit(13);
          }
          console.log(`P2 CINEMA TECHNICAL QC ${ready===9?'PASS':'PENDING'} ready=${ready}/9 score=${score} visual=${b.visualReview}`);
          NODE

      - name: Observe user-started Cinema visual QC
        id: visualqc
        if: steps.deploy.outputs.state == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -H 'cache-control: no-cache' "$P2_URL/api/cinema/batch/visual-qc/latest-public" > visual-qc.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('visual-qc.json','utf8'));
          if(b.ok!==true || Number(b.total)!==9 || !Array.isArray(b.clips) || !Array.isArray(b.candidates)) { console.error(b); process.exit(14); }
          const status=String(b.status||'unknown'), ready=Number(b.ready||0), scored=Number(b.scoredCount||0), score=b.visualScore==null?null:Number(b.visualScore), candidates=b.candidates.length;
          if(status==='complete' && (ready!==9 || scored!==9 || b.clips.length!==9)) { console.error('Completed visual QC must contain 9 scored results', b); process.exit(15); }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\nready=${ready}\nscored=${scored}\nscore=${score??''}\ncandidates=${candidates}\npass=${b.pass===true}\n`);
          console.log(`P2 VISUAL QC OBSERVE status=${status} ready=${ready}/9 scored=${scored}/9 score=${score} candidates=${candidates} paid=${b.paidAiTriggered===true}`);
          console.log('P3 did not trigger paid visual AI and did not trigger regeneration.');
          NODE

      - name: Observe user-started Cinema motion QC
        id: motionqc
        if: steps.deploy.outputs.state == 'success'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 15 -H 'cache-control: no-cache' "$P2_URL/api/cinema/batch/motion-qc/latest-public" > motion-qc.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('motion-qc.json','utf8'));
          if(b.ok!==true || Number(b.total)!==9 || !Array.isArray(b.clips) || !Array.isArray(b.candidates)) { console.error(b); process.exit(16); }
          const status=String(b.status||'unknown'), ready=Number(b.ready||0), scored=Number(b.scoredCount||0), score=b.motionScore==null?null:Number(b.motionScore), candidates=b.candidates.length;
          if(status==='complete' && (ready!==9 || scored!==9 || b.clips.length!==9)) { console.error('Completed motion QC must contain 9 scored results', b); process.exit(17); }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\nready=${ready}\nscored=${scored}\nscore=${score??''}\ncandidates=${candidates}\npass=${b.pass===true}\n`);
          console.log(`P2 MOTION QC OBSERVE status=${status} ready=${ready}/9 scored=${scored}/9 score=${score} candidates=${candidates} paid=${b.paidAiTriggered===true}`);
          console.log('P3 did not trigger paid motion AI and did not trigger regeneration.');
          NODE

      - name: Report supervisor result
        if: always()
        shell: bash
        env:
          MAIN_SHA: ${{ steps.head.outputs.sha }}
          DEPLOY_STATE: ${{ steps.deploy.outputs.state }}
          DEPLOY_URL: ${{ steps.deploy.outputs.run_url }}
          QUALITY_READY: ${{ steps.quality.outputs.ready }}
          QUALITY_SCORE: ${{ steps.quality.outputs.score }}
          QUALITY_PASS: ${{ steps.quality.outputs.pass }}
          VISUAL_STATE: ${{ steps.visualqc.outputs.status }}
          VISUAL_READY: ${{ steps.visualqc.outputs.ready }}
          VISUAL_SCORED: ${{ steps.visualqc.outputs.scored }}
          VISUAL_SCORE: ${{ steps.visualqc.outputs.score }}
          VISUAL_CANDIDATES: ${{ steps.visualqc.outputs.candidates }}
          VISUAL_PASS: ${{ steps.visualqc.outputs.pass }}
          MOTION_STATE: ${{ steps.motionqc.outputs.status }}
          MOTION_READY: ${{ steps.motionqc.outputs.ready }}
          MOTION_SCORED: ${{ steps.motionqc.outputs.scored }}
          MOTION_SCORE: ${{ steps.motionqc.outputs.score }}
          MOTION_CANDIDATES: ${{ steps.motionqc.outputs.candidates }}
          MOTION_PASS: ${{ steps.motionqc.outputs.pass }}
        run: |
          {
            echo "### P2 ↔ P3 safe supervisor"
            echo "- P2 main: \`$MAIN_SHA\`"
            echo "- P2 deployment ownership: P2 only; P3 uses direct production runtime probes"
            echo "- P2 runtime probe state: \`${DEPLOY_STATE:-unknown}\`"
            echo "- Production URL: $P2_URL"
            echo "- Cinema technical QC: ready=${QUALITY_READY:-unknown}/9 score=${QUALITY_SCORE:-unknown} pass=${QUALITY_PASS:-unknown}"
            echo "- Cinema visual QC: status=${VISUAL_STATE:-idle} ready=${VISUAL_READY:-0}/9 scored=${VISUAL_SCORED:-0}/9 score=${VISUAL_SCORE:-unset} pass=${VISUAL_PASS:-false} candidates=${VISUAL_CANDIDATES:-0}"
            echo "- Cinema motion QC: status=${MOTION_STATE:-idle} ready=${MOTION_READY:-0}/9 scored=${MOTION_SCORED:-0}/9 score=${MOTION_SCORE:-unset} pass=${MOTION_PASS:-false} candidates=${MOTION_CANDIDATES:-0}"
            echo "- P3 mode: read-only external supervisor"
            echo "- Paid Cinema generation: NEVER triggered by this workflow"
            echo "- Paid visual AI QC: NEVER triggered by this workflow; P3 only observes user-started QC"
            echo "- Paid motion AI QC: NEVER triggered by this workflow; P3 only observes user-started QC"
            echo "- Automatic Cinema regeneration: NEVER triggered by this workflow"
            echo "- Cloudflare resource delete/recreate/rebind: NEVER performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
